services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal_cerrado
      POSTGRES_USER: portal_user
      POSTGRES_PASSWORD: portal_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      portal_cerrado_net:
        aliases: [postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal_user -d portal_cerrado"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    networks:
      portal_cerrado_net:
        aliases: [redis]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  portal_cerrado:
    image: portal-cerrado-backend:local
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://portal_user:portal_pass@postgres:5432/portal_cerrado
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: gemini
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: gemini-flash-lite-latest
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      SITE_URL: "${NEXT_PUBLIC_SITE_URL}"
      NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL}"
      NEXT_PUBLIC_API_URL: http://portal_cerrado:8000
      CELERY_SCHEDULER: "1"
      PUBLISH_API_KEY: "${PUBLISH_API_KEY}"
      CORS_ALLOWED_ORIGINS: "http://100.95.111.24:3000,http://localhost:3000"
      ENVIRONMENT: production
      SIMILARITY_THRESHOLD: "0.35"
      DATABASE_CONNECT_RETRIES: "10"
      DATABASE_CONNECT_RETRY_DELAY: "1"
    volumes:
      - app_data:/app/data
    networks:
      portal_cerrado_net:
        aliases: [portal_cerrado, portal-cerrado-api]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery_worker:
    image: portal-cerrado-backend:local
    restart: unless-stopped
    command: celery -A app.celery_app worker -l info
    environment:
      DATABASE_URL: postgresql://portal_user:portal_pass@postgres:5432/portal_cerrado
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: gemini
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: gemini-flash-lite-latest
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      SITE_URL: "${NEXT_PUBLIC_SITE_URL}"
      NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL}"
      ENVIRONMENT: production
      SIMILARITY_THRESHOLD: "0.35"
      DATABASE_CONNECT_RETRIES: "10"
      DATABASE_CONNECT_RETRY_DELAY: "1"
    volumes:
      - app_data:/app/data
    networks:
      - portal_cerrado_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis; redis.Redis(host='redis').ping()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery_beat:
    image: portal-cerrado-backend:local
    restart: unless-stopped
    command: celery -A app.celery_app beat -l info
    environment:
      DATABASE_URL: postgresql://portal_user:portal_pass@postgres:5432/portal_cerrado
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: gemini
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: gemini-flash-lite-latest
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      SITE_URL: "${NEXT_PUBLIC_SITE_URL}"
      NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL}"
      ENVIRONMENT: production
      SIMILARITY_THRESHOLD: "0.35"
      DATABASE_CONNECT_RETRIES: "10"
      DATABASE_CONNECT_RETRY_DELAY: "1"
    volumes:
      - app_data:/app/data
    networks:
      - portal_cerrado_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis; redis.Redis(host='redis').ping()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  flower:
    image: portal-cerrado-backend:local
    restart: unless-stopped
    command: celery -A app.celery_app flower --port=5555
    environment:
      DATABASE_URL: postgresql://portal_user:portal_pass@postgres:5432/portal_cerrado
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: gemini
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: gemini-flash-lite-latest
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    networks:
      - portal_cerrado_net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5555/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: portal-cerrado-frontend:local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://portal_cerrado:8000
      API_URL: http://portal_cerrado:8000
      NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL}"
    networks:
      - portal_cerrado_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  app_data:

networks:
  portal_cerrado_net:
    driver: overlay
    attachable: true
