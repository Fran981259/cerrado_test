# Configuração do Orquestrador — Atualiza Brasil
# Responsável por gerenciar o workflow diário e as regras de publicação

orchestrator:
  name: "Atualiza Brasil"
  version: "1.0.0"
  timezone: "America/Sao_Paulo"
  run_mode: "production"  # production, development, dry_run
  
  # Frequência padrão de verificação
  check_interval_minutes: 30
  max_concurrent_tasks: 5
  
  # Rate limiting para respeitar servidores
  rate_limit:
    min_delay_seconds: 2
    max_requests_per_minute: 20
  
  # Cache de respostas
  cache:
    enabled: true
    ttl_seconds: 3600

database:
  url: "postgresql://portal_user:portal_pass@postgres:5432/atualiza_brasil"
  pool_size: 5
  echo: false  # True para debug

redis:
  url: "redis://redis:6379/0"
  session_ttl: 86400

openai:
  model: "gpt-4"
  temperature: 0.7
  max_tokens: 1500
  timeout_seconds: 120

