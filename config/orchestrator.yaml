# Regras profissionais de escrita — ATUALIZADO 28/08/2026
writing_rules:
  professional_standard:
    enabled: true
    min_words: 700
    max_words: 900
    require_cross_reference: true
    min_sources: 3  # 1 principal + 2 cruzadas
    structure: ["lead", "contexto_historico", "desenvolvimento_com_dados", "analise_impacto_ms", "fechamento_desdobramentos"]
    require_data_and_quotes: true
    forbidden: ["resumo curto", "cópia literal", "matéria sem fontes cruzadas"]
    enforcement: "bloqueia publicação se < 700 palavras ou < 2 fontes cruzadas"

# Portal de referência legal
legal:
  copyright_notice: |
    Conteúdo publicado sob direitos autorais próprios. 
    Fontes sempre citadas conforme Art. 46/47 da Lei 9.610/98.
  attribution_template: |
    Fonte: {{source}} | Publicado: Atualiza Brasil | Data: {{timestamp}}
  compliance_check_enabled: true
  log_retention_days: 90

# Notificação e alertas
notifications:
  email:
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    admin_email: "admin@atualizabrasil.news"
  slack:
    webhook_url: ""  # configurar em produção

# Métricas e analytics
analytics:
  track_impressions: true
  track_engagement: true
  daily_report_enabled: true