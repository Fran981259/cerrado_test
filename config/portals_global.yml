# ============================================================
# CONFIGURAÇÃO: Miner de Portais Globais — Portal Cerrado
# ============================================================
# Toda notícia minerada do exterior é SEMPRE publicada em pt-BR.
# Idioma de destino: pt-BR (Português Brasileiro)
# Idioma de origem: en, es, fr, de (configurável por portal)
# ============================================================

global_miner:
  enabled: true
  check_interval_minutes: 30

  # =========================================
  # CONFIGURAÇÃO DE IDIOMA
  # =========================================
  language:
    target: "pt-BR"  # SEMPRE pt-BR
    target_locale: "pt_BR"
    
    # Idiomas aceitos como origem
    source_languages:
      - "en"  # Inglês (principal)
      - "es"  # Espanhol
      - "fr"  # Francês
      - "de"  # Alemão
    
    # Tradução automática via LLM
    auto_translate: true
    translation_model: "gpt-4"
    
    # Glossário de termos (garante consistência)
    glossary:
      "AI": "inteligência artificial"
      "startup": "startup"
      "funding round": "rodada de investimento"
      "IPO": "oferta pública inicial (IPO)"
      "merger": "fusão"
      "acquisition": "aquisição"
      "CEO": "CEO"
      "layoffs": "demissões"
      "interest rates": "taxas de juros"
      "inflation": "inflação"
      "GDP": "PIB"
      "supply chain": "cadeia de suprimentos"
      "Federal Reserve": "Federal Reserve (Banco Central dos EUA)"
      "White House": "Casa Branca"
      "Congress": "Congresso"
      "Supreme Court": "Suprema Corte"
    
    # Termos que NÃO devem ser traduzidos
    preserve_terms:
      - "OpenAI"
      - "ChatGPT"
      - "Microsoft"
      - "Google"
      - "Apple"
      - "Tesla"
      - "iPhone"
      - "Wall Street"
      - "NASDAQ"
      - "Dow Jones"
      - "S&P 500"
      - "BRICS"
      - "G7"
      - "G20"
      - "NATO"
      - "WHO"
      - "FDA"
      - "NASA"

