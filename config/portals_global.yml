  # =========================================
  # CONFIGURAÇÃO DE TRADUÇÃO
  # =========================================
  translation:
    # Prompt de tradução
    system_prompt: |
      Você é um tradutor especializado em jornalismo.
      Traduza o texto a seguir do {SOURCE_LANG} para Português Brasileiro (pt-BR).
      
      REGRAS:
      1. Use linguagem natural e fluente, sem parecer tradução literal
      2. Mantenha nomes próprios, marcas e termos técnicos no original
      3. Adapte expressões idiomáticas para equivalentes em pt-BR
      4. Use formatação jornalística brasileira
      5. Mantenha o tom e o sentido original
      6. Preserve dados numéricos e estatísticas
      7. Use vírgulas e acentos corretamente
      8. Adicione contexto brasileiro quando relevante
    
    # Configurações de processamento
    preserve_html: false
    max_length: 8000
    chunk_size: 2000
    overlap: 200

  # =========================================
  # ROTEAMENTO PARA REPÓRTERES
  # =========================================
  reporter_routing:
    technology:
      reporter: "enzo.bianchi"
      categories: ["tech", "AI", "startups", "gadgets"]
      
    economy:
      reporter: "camila.rocha"
      categories: ["markets", "finance", "economy", "business"]
      
    geopolitics:
      reporter: "luciana.freitas"
      categories: ["world", "geopolitics", "policy", "diplomacy"]
      
    health:
      reporter: "maya.santos"
      categories: ["health", "medicine", "science", "research"]
      
    sports:
      reporter: "marcus.teixeira"
      categories: ["sports", "athlete", "tournament"]
      
    agriculture:
      reporter: "bia.fernandes"
      categories: ["agriculture", "commodity", "food", "climate"]
      
    culture:
      reporter: "leon.vaz"
      categories: ["culture", "entertainment", "art", "media"]
      
    security:
      reporter: "rafael.dumas"
      categories: ["security", "cyber", "conflict", "war"]
      
    education:
      reporter: "lucas.nakamura"
      categories: ["education", "university", "research", "academic"]

  # =========================================
  # MONITORAMENTO
  # =========================================
  monitoring:
    log_mined_articles: true
    log_translations: true
    log_routing: true
    alert_on_failure: true
    metrics:
      - "articles_mined_per_hour"
      - "translations_completed"
      - "translation_quality_score"
      - "rejection_rate"
      - "average_translation_time"