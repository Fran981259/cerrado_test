  # =========================================
  # GOOGLE NEWS RSS (pt-BR / Brasil)
  # Descoberta de pauta nacional + regional. O <source> do RSS vira a fonte
  # (ex: G1, UOL) e o link é resolvido para o publisher quando possível.
  # NOTA robots: news.google.com/rss responde Disallow no robots.txt, mas este
  # é o endpoint de sindicação do próprio Google e o uso foi autorizado
  # explicitamente pelo dono do projeto (opt-in abaixo, por busca).
